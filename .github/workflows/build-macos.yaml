name: Build macOS App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        brew install create-dmg
        pip install pyinstaller flask flask-sqlalchemy flask-login pytelegrambotapi python-dotenv requests pywebview

    - name: Create launcher script
      run: |
        echo 'import webview' > launcher.py
        echo 'import threading' >> launcher.py
        echo 'import time' >> launcher.py
        echo 'import sys' >> launcher.py
        echo 'import os' >> launcher.py
        echo '' >> launcher.py
        echo '# Add current directory to Python path' >> launcher.py
        echo 'sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))' >> launcher.py
        echo '' >> launcher.py
        echo 'def run_flask():' >> launcher.py
        echo '    try:' >> launcher.py
        echo '        from app import main' >> launcher.py
        echo '        main()' >> launcher.py
        echo '    except Exception as e:' >> launcher.py
        echo '        print(f"Error starting application: {e}")' >> launcher.py
        echo '        import traceback' >> launcher.py
        echo '        traceback.print_exc()' >> launcher.py
        echo '' >> launcher.py
        echo 'if __name__ == "__main__":' >> launcher.py
        echo '    # Start Flask in background thread' >> launcher.py
        echo '    flask_thread = threading.Thread(target=run_flask, daemon=True)' >> launcher.py
        echo '    flask_thread.start()' >> launcher.py
        echo '    ' >> launcher.py
        echo '    # Wait for server to start' >> launcher.py
        echo '    time.sleep(5)' >> launcher.py
        echo '    ' >> launcher.py
        echo '    # Create and start webview window' >> launcher.py
        echo '    webview.create_window(' >> launcher.py
        echo '        "CRM Telegram Bot", ' >> launcher.py
        echo '        "http://127.0.0.1:2000/system-monitor", ' >> launcher.py
        echo '        width=1200, ' >> launcher.py
        echo '        height=800,' >> launcher.py
        echo '        min_size=(800, 600)' >> launcher.py
        echo '    )' >> launcher.py
        echo '    webview.start()' >> launcher.py

    - name: Build application
      run: |
        mkdir -p dist_src
        cp -r app.py config.py models.py routes utils templates static dist_src/
        cp .env dist_src/ 2>/dev/null || true
        cp CRMclassbot.py dist_src/ 2>/dev/null || true
        
        pyinstaller --windowed --name CRMTelegramBot --add-data "dist_src/app.py:." --add-data "dist_src/config.py:." --add-data "dist_src/models.py:." --add-data "dist_src/routes:routes" --add-data "dist_src/utils:utils" --add-data "dist_src/templates:templates" --add-data "dist_src/static:static" --add-data "dist_src/.env:." --add-data "dist_src/CRMclassbot.py:." --hidden-import=flask --hidden-import=flask_sqlalchemy --hidden-import=flask_login --hidden-import=telebot --hidden-import=python_dotenv --hidden-import=sqlalchemy --hidden-import=engineio --hidden-import=jinja2 --collect-all=werkzeug launcher.py

    - name: Create disk image
      run: |
        create-dmg --volname "CRM Telegram Bot" --window-pos 200 120 --window-size 800 400 --icon-size 100 --icon "CRMTelegramBot.app" 200 190 --hide-extension "CRMTelegramBot.app" --app-drop-link 600 185 "CRMTelegramBot.dmg" "dist/CRMTelegramBot.app"

    - name: Create Release and Upload DMG
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: CRMTelegramBot.dmg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (Manual Build)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: CRMTelegramBot-macOS
        path: CRMTelegramBot.dmg
        retention-days: 30