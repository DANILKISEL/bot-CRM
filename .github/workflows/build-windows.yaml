name: Build macOS App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        brew install create-dmg
        pip install pyinstaller flask flask-sqlalchemy flask-login pytelegrambotapi python-dotenv requests pywebview

    - name: Create launcher script
      run: |
        cat > launcher.py << 'EOF'
import webview
import threading
import time
import sys
import os

# Add current directory to Python path
sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))

def run_flask():
    try:
        from app import main
        main()
    except Exception as e:
        print(f"Error starting application: {e}")
        import traceback
        traceback.print_exc()

if __name__ == '__main__':
    # Start Flask in background thread
    flask_thread = threading.Thread(target=run_flask, daemon=True)
    flask_thread.start()
    
    # Wait for server to start
    time.sleep(5)
    
    # Create and start webview window
    webview.create_window(
        'CRM Telegram Bot', 
        'http://127.0.0.1:2000/system-monitor', 
        width=1200, 
        height=800,
        min_size=(800, 600)
    )
    webview.start()
EOF

    - name: Build application
      run: |
        # Copy all necessary files to dist directory structure
        mkdir -p dist_src
        cp -r app.py config.py models.py routes utils templates static dist_src/
        cp .env dist_src/ 2>/dev/null || true
        cp CRMclassbot.py dist_src/ 2>/dev/null || true
        
        # Build with PyInstaller
        pyinstaller --windowed \
          --name CRMTelegramBot \
          --add-data "dist_src/app.py:." \
          --add-data "dist_src/config.py:." \
          --add-data "dist_src/models.py:." \
          --add-data "dist_src/routes:routes" \
          --add-data "dist_src/utils:utils" \
          --add-data "dist_src/templates:templates" \
          --add-data "dist_src/static:static" \
          --add-data "dist_src/.env:." \
          --add-data "dist_src/CRMclassbot.py:." \
          --hidden-import=flask \
          --hidden-import=flask_sqlalchemy \
          --hidden-import=flask_login \
          --hidden-import=telebot \
          --hidden-import=python_dotenv \
          --hidden-import=sqlalchemy \
          --hidden-import=engineio \
          --hidden-import=jinja2 \
          --collect-all=werkzeug \
          launcher.py

    - name: Create disk image
      run: |
        create-dmg \
          --volname "CRM Telegram Bot" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "CRMTelegramBot.app" 200 190 \
          --hide-extension "CRMTelegramBot.app" \
          --app-drop-link 600 185 \
          "CRMTelegramBot.dmg" \
          "dist/CRMTelegramBot.app"

    - name: Create Release and Upload DMG
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: CRMTelegramBot.dmg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (Manual Build)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: CRMTelegramBot-macOS
        path: CRMTelegramBot.dmg
        retention-days: 30