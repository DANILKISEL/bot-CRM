name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flask flask-sqlalchemy flask-login pytelegrambotapi python-dotenv requests

    - name: Create launcher script
      run: |
        echo "import sys" > windows_launcher.py
        echo "import os" >> windows_launcher.py
        echo "import threading" >> windows_launcher.py
        echo "import webbrowser" >> windows_launcher.py
        echo "import time" >> windows_launcher.py
        echo. >> windows_launcher.py
        echo "# Add current directory to Python path" >> windows_launcher.py
        echo "sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))" >> windows_launcher.py
        echo. >> windows_launcher.py
        echo "def main():" >> windows_launcher.py
        echo "    print('Starting CRM Telegram Bot...')" >> windows_launcher.py
        echo "    print('Server: http://127.0.0.1:2000')" >> windows_launcher.py
        echo "    print('Login: admin / admin123')" >> windows_launcher.py
        echo "    print('Press Ctrl+C to stop')" >> windows_launcher.py
        echo "    print()" >> windows_launcher.py
        echo "    " >> windows_launcher.py
        echo "    def open_browser():" >> windows_launcher.py
        echo "        time.sleep(5)" >> windows_launcher.py
        echo "        webbrowser.open('http://127.0.0.1:2000/system-monitor')" >> windows_launcher.py
        echo "    " >> windows_launcher.py
        echo "    browser_thread = threading.Thread(target=open_browser, daemon=True)" >> windows_launcher.py
        echo "    browser_thread.start()" >> windows_launcher.py
        echo "    " >> windows_launcher.py
        echo "    try:" >> windows_launcher.py
        echo "        from app import main as bot_main" >> windows_launcher.py
        echo "        bot_main()" >> windows_launcher.py
        echo "    except Exception as e:" >> windows_launcher.py
        echo "        print(f'Error starting application: {e}')" >> windows_launcher.py
        echo "        import traceback" >> windows_launcher.py
        echo "        traceback.print_exc()" >> windows_launcher.py
        echo "        input('Press Enter to exit...')" >> windows_launcher.py
        echo. >> windows_launcher.py
        echo "if __name__ == '__main__':" >> windows_launcher.py
        echo "    main()" >> windows_launcher.py

    - name: Prepare distribution files
      run: |
        mkdir dist_src
        copy app.py dist_src\
        copy config.py dist_src\
        copy models.py dist_src\
        copy CRMclassbot.py dist_src\ 2>nul
        copy .env dist_src\ 2>nul
        xcopy routes dist_src\routes /E /I
        xcopy utils dist_src\utils /E /I
        xcopy templates dist_src\templates /E /I
        xcopy static dist_src\static /E /I

    - name: Build EXE
      run: |
        pyinstaller --onefile --console --name CRMTelegramBot --add-data "dist_src\app.py;." --add-data "dist_src\config.py;." --add-data "dist_src\models.py;." --add-data "dist_src\routes;routes" --add-data "dist_src\utils;utils" --add-data "dist_src\templates;templates" --add-data "dist_src\static;static" --add-data "dist_src\.env;." --add-data "dist_src\CRMclassbot.py;." --hidden-import=flask --hidden-import=flask_sqlalchemy --hidden-import=flask_login --hidden-import=telebot --hidden-import=python_dotenv --hidden-import=sqlalchemy --hidden-import=engineio --hidden-import=jinja2 --hidden-import=werkzeug --collect-all=werkzeug windows_launcher.py

    - name: Create Release and Upload EXE
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/CRMTelegramBot.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (Manual Build)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: CRMTelegramBot-Windows
        path: dist/CRMTelegramBot.exe
        retention-days: 30