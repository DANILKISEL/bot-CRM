name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flask flask-sqlalchemy flask-login pytelegrambotapi python-dotenv requests

    - name: Create launcher script
      run: |
        $launcherContent = @'
import sys
import os
import threading
import webbrowser
import time

# Add current directory to Python path
sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))

def main():
    print('Starting CRM Telegram Bot...')
    print('Server: http://127.0.0.1:2000')
    print('Login: admin / admin123')
    print('Press Ctrl+C to stop\n')

    def open_browser():
        time.sleep(5)
        webbrowser.open('http://127.0.0.1:2000/system-monitor')

    # Start browser in background thread
    browser_thread = threading.Thread(target=open_browser, daemon=True)
    browser_thread.start()

    try:
        from app import main as bot_main
        bot_main()
    except Exception as e:
        print(f"Error starting application: {e}")
        import traceback
        traceback.print_exc()
        input("Press Enter to exit...")

if __name__ == '__main__':
    main()
'@
        $launcherContent | Out-File -FilePath windows_launcher.py -Encoding utf8

    - name: Prepare distribution files
      run: |
        # Create directory structure for distribution
        New-Item -ItemType Directory -Path "dist_src" -Force
        Copy-Item "app.py" "dist_src/"
        Copy-Item "config.py" "dist_src/"
        Copy-Item "models.py" "dist_src/"
        Copy-Item "CRMclassbot.py" "dist_src/" -ErrorAction SilentlyContinue
        Copy-Item ".env" "dist_src/" -ErrorAction SilentlyContinue
        
        # Copy directories recursively
        Copy-Item "routes" "dist_src/" -Recurse -Force
        Copy-Item "utils" "dist_src/" -Recurse -Force
        Copy-Item "templates" "dist_src/" -Recurse -Force
        Copy-Item "static" "dist_src/" -Recurse -Force

    - name: Build EXE
      run: |
        pyinstaller --onefile --console --name CRMTelegramBot `
          --add-data "dist_src\app.py;." `
          --add-data "dist_src\config.py;." `
          --add-data "dist_src\models.py;." `
          --add-data "dist_src\routes;routes" `
          --add-data "dist_src\utils;utils" `
          --add-data "dist_src\templates;templates" `
          --add-data "dist_src\static;static" `
          --add-data "dist_src\.env;." `
          --add-data "dist_src\CRMclassbot.py;." `
          --hidden-import=flask `
          --hidden-import=flask_sqlalchemy `
          --hidden-import=flask_login `
          --hidden-import=telebot `
          --hidden-import=python_dotenv `
          --hidden-import=sqlalchemy `
          --hidden-import=engineio `
          --hidden-import=jinja2 `
          --hidden-import=werkzeug `
          --collect-all=werkzeug `
          windows_launcher.py

    - name: Create Release and Upload EXE
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/CRMTelegramBot.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (Manual Build)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: CRMTelegramBot-Windows
        path: dist/CRMTelegramBot.exe
        retention-days: 30